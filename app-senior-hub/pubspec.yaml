name: senior_hub
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1
environment:
  sdk: ^3.10.7
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_bloc: ^9.1.1
  equatable: ^2.0.8
  get_it: ^9.2.0
  dio: ^5.9.0
  shared_preferences: ^2.5.4
  go_router: ^17.0.1
  dartz: ^0.10.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.10.5
  flutter_launcher_icons: ^0.14.4
flutter:
  uses-material-design: true
assets:
  - assets/images/
  - assets/icons/
flutter_launcher_icons:
  android: true
  ios: true
  web:
    generate: false
    image_path: "assets/icon/app_icon.png"
    background_color: "#ffffff"
    theme_color: "#ffffff"
  image_path: "assets/icons/app_icon.png"